<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081b2b"><link rel="manifest" href="/manifest.webmanifest"><title>AI TRADER PRO</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#e8f5f3;background:#071625}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#071625,#102e3c);min-height:100vh}.shell{max-width:1050px;margin:auto;padding:22px 15px 110px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:22px;font-weight:850;letter-spacing:1px;color:#e6c26a}.pill{border:1px solid #31545b;padding:8px 12px;border-radius:20px;color:#9bbab8;font-size:12px}.card{background:#112a38;border:1px solid #234b54;border-radius:18px;padding:19px;margin-top:17px;box-shadow:0 8px 25px #0002} #trades{white-space:pre-line;line-height:2}h1{font-size:21px;margin:6px 0 15px}h2{font-size:17px;margin:0 0 12px}.muted{color:#a3b8bd;font-size:13px}.number{font-size:32px;font-weight:800;color:#e6c26a}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#0a202d;border-radius:12px;padding:12px;text-align:center}.stat strong{display:block;font-size:19px;color:#fff}.chart{width:100%;height:170px;margin-top:14px;background:#0a202d;border-radius:12px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#0a1e2c;border-top:1px solid #34525b;display:flex;overflow:auto;justify-content:center;gap:3px;padding:10px 6px max(10px,env(safe-area-inset-bottom))}.tabs button{color:#b4c8ca;background:transparent;border:0;border-radius:10px;padding:11px 9px;white-space:nowrap;font-size:12px;cursor:pointer}.tabs button.active{background:#174b4a;color:#6ee7b7}.btn{background:#136c64;color:white;border:0;border-radius:11px;padding:11px 16px;font-weight:700}.warn{color:#ffd18a}.ok{color:#65e4b6}#panel{min-height:330px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.tabs{justify-content:flex-start}.shell{padding-top:14px}}</style></head><body><main class="shell"><div class="top"><div class="brand">AI TRADER PRO</div><span class="pill">نسخهٔ آزمایشی • معاملات واقعی قفل</span></div><section class="card" id="panel" aria-live="polite"></section></main><nav class="tabs" id="tabs" aria-label="بخش‌های برنامه"></nav><script>
const tabs=['داشبورد','مغز ربات','بازار','معاملات','استراتژی','آزمایشگاه','امنیت'];
let active=0,token='',state=null;
const panel=document.querySelector('#panel'),nav=document.querySelector('#tabs');
const fmt=n=>Number(n||0).toFixed(2);
const api=async(path,method='GET',body)=>{const r=await fetch(path,{method,headers:{'content-type':'application/json','x-csrf-token':token},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()};
async function refresh(){try{state=await api('/api/paper');if(!token)token=(await api('/api/session')).csrf_token}catch(e){state=null;token=''}draw()}
async function login(){const pass=document.querySelector('#password').value;try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pass})});if(!r.ok)throw Error('ورود ناموفق');token=(await r.json()).csrf_token;await refresh()}catch(e){document.querySelector('#message').textContent=e.message}}
async function action(a,mode){try{state=await api('/api/paper/action','POST',{action:a,mode});draw()}catch(e){alert('عملیات انجام نشد: '+e.message)}}
async function renderEquityChart(){
 const svg=document.querySelector('#equity-chart');if(!svg)return;
 try{const data=await api('/api/paper/equity-history');if(!svg.isConnected)return;
 const vals=data.map(x=>x.equity);if(!vals.length)return;
 const lo=Math.min(...vals)-.02,hi=Math.max(...vals)+.02,span=Math.max(.001,hi-lo);
 const points=vals.map((v,i)=>`${(i/Math.max(1,vals.length-1)*580+10).toFixed(1)},${(155-(v-lo)/span*140).toFixed(1)}`).join(' ');
 svg.innerHTML=`<polyline points="${points}" fill="none" stroke="#65d6b3" stroke-width="3"/><text x="12" y="16" fill="#a3b8bd" font-size="13">تاریخچهٔ واقعی سرمایهٔ آزمایشی • ${vals.length} نقطه</text>`;
 }catch(e){svg.textContent='تاریخچه در دسترس نیست'}
}
function draw(){nav.innerHTML='';tabs.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.className=i===active?'active':'';b.onclick=()=>{active=i;draw()};nav.appendChild(b)});
if(!state){panel.innerHTML='<h1>ورود امن به محیط آزمایشی</h1><p class="muted">رمز سرور را وارد کنید. هیچ کلید Binance وارد نکنید.</p><input id="password" type="password" autocomplete="current-password" placeholder="رمز برنامه" style="width:100%;padding:13px;border-radius:10px;background:#081b2b;color:white;border:1px solid #40606b"><p><button class="btn" id="login">ورود</button></p><p id="message" class="warn"></p>';document.querySelector('#login').onclick=login;return}
if(active===0){panel.innerHTML=`<h1>داشبورد آزمایشی</h1><p class="muted">داده‌ها مصنوعی‌اند؛ هیچ قیمت یا معاملهٔ واقعی نیست.</p><div class="number">$${fmt(state.equity)}</div><div class="stats"><div class="stat">معاملات بسته<strong>${state.closed_trades}</strong></div><div class="stat">سود/زیان تحقق‌یافته<strong>$${fmt(state.realized_pnl)}</strong></div><div class="stat">افت سرمایه<strong>${fmt(state.drawdown_pct)}٪</strong></div></div><svg class="chart" id="equity-chart" viewBox="0 0 600 170" preserveAspectRatio="none"><text x="20" y="85" fill="#9bbab8">در حال خواندن تاریخچه...</text></svg><p>حالت: ${state.risk_mode} | دور: ${state.ticks} | ${state.running?'در حال اجرا':'متوقف'}</p><p class="warn">${state.locked?'قفل مدیریت ریسک فعال است':'معاملات واقعی کاملاً غیرفعال است'}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="start">شروع</button><button class="btn" id="tick">یک دور آزمایش</button><button class="btn" id="stop">توقف</button><button class="btn" id="reset">بازنشانی</button></div>`;['start','tick','stop','reset'].forEach(x=>document.getElementById(x).onclick=()=>{if(x==='reset'&&!confirm('اطلاعات آزمایشی پاک شود؟'))return;action(x)});renderEquityChart()}
else if(active===1){panel.innerHTML=`<h1>مغز ربات</h1><p>موتور شبیه‌سازی با قیمت‌های مصنوعی و سناریوی تکرارپذیر</p><p>تعداد دور: ${state.ticks}</p><p>زیان‌های متوالی: ${state.consecutive_losses}</p><p class="warn">اجرای خودکار فقط در صورتی فعال است که تنظیم PAPER_AUTO_WORKER در سرور روشن باشد؛ در غیر آن از فرمان آزمایش استفاده کنید.</p>`}
else if(active===2){panel.innerHTML=`<h1>بازار</h1><p class="warn">قیمت واقعی Binance هنوز متصل نشده است.</p><p>قیمت سناریوی مصنوعی: $${fmt(state.price)}</p><p class="muted">این رقم قیمت بازار نیست.</p>`}
else if(active===3){panel.innerHTML='<h1>معاملات آزمایشی</h1><p id="trades" class="muted">در حال خواندن...</p>';api('/api/paper/trades').then(a=>{if(active===3)document.querySelector('#trades').textContent=a.length?a.slice(0,20).map(t=>`#${t.id} | ${t.mode} | ${t.closed?'بسته':'باز'} | PnL: ${t.pnl===null?'—':fmt(t.pnl)}`).join('\n'):'هنوز معامله‌ای ثبت نشده'}).catch(()=>{})}
else if(active===4){panel.innerHTML=`<h1>استراتژی و مدیریت ریسک</h1><p>حالت فعلی: ${state.risk_mode}</p><p class="muted">حد نظری زیان هر ورود ۰.۵٪ سرمایه؛ قفل افت سرمایه ۱٪؛ سه زیان متوالی</p><div style="display:flex;gap:8px;flex-wrap:wrap">${[['defensive','دفاعی'],['smart','هوشمند'],['aggressive','تهاجمی']].map(([k,v])=>`<button class="btn" data-mode="${k}">${v}</button>`).join('')}</div><p class="muted">برای تغییر حالت، ابتدا ربات را متوقف کن.</p>`;panel.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>action('risk_mode',b.dataset.mode))}
else if(active===5){panel.innerHTML='<h1>آزمایشگاه</h1><p>آزمایش وضعیت سرور و قفل معاملات واقعی</p><button class="btn" id="check">اجرای بررسی</button><p id="result"></p>';document.querySelector('#check').onclick=async()=>{try{const [h,s]=await Promise.all([api('/api/health'),api('/api/status')]);document.querySelector('#result').textContent=h.ok&&!h.live_trading&&!s.live_trading_enabled&&!s.binance_connected?'موفق: سرور پاسخ می‌دهد و معاملات واقعی غیرفعال است':'هشدار: وضعیت غیرمنتظره'}catch(e){document.querySelector('#result').textContent=e.message}}}
else {panel.innerHTML='<h1>امنیت</h1><p class="ok">قفل معاملات واقعی: فعال</p><p class="muted">رمز ورود برای API آزمایشی لازم است. هیچ کلید Binance ذخیره یا درخواست نمی‌شود.</p><button class="btn" id="logout">خروج</button>';document.querySelector('#logout').onclick=()=>{api('/api/logout','POST').finally(()=>{token='';state=null;draw()})}}
}
refresh();setInterval(()=>{if(state&&state.running)refresh()},10000);if('serviceWorker'in navigator)navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
</script></body></html>
